<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 可视化编辑器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="toolbar">
  <span id="logo">HTML 编辑器</span>
  <button class="btn" id="btn-open" title="打开本地 HTML 文件 (Ctrl+O)">打开</button>
  <input type="file" id="file-input" accept=".html,.htm,.xhtml,text/html" hidden>
  <button class="btn btn-primary" id="btn-export" title="导出编辑后的 HTML (Ctrl+S)">导出 HTML</button>
  <span class="tb-sep"></span>
  <button class="btn" id="btn-undo" title="撤销 (Ctrl+Z)" disabled>撤销</button>
  <button class="btn" id="btn-redo" title="重做 (Ctrl+Y)" disabled>重做</button>
  <button class="btn" id="btn-reset" title="恢复为打开时的原始内容">重置</button>
  <button class="btn" id="btn-refresh" title="按当前源码重新渲染预览">刷新预览</button>
  <span class="tb-sep"></span>
  <label class="chk" title="默认禁用页面脚本以保证编辑稳定；开启后脚本会执行并可能干扰编辑">
    <input type="checkbox" id="chk-scripts"> 允许页面脚本
  </label>
  <button class="btn" id="btn-newwin" title="在浏览器新窗口中打开当前预览">新窗口预览</button>
  <span class="tb-flex"></span>
  <span id="dirty-dot" title="有未导出的修改" hidden>●</span>
  <input type="text" id="filename" value="示例页面.html" title="导出文件名（可修改，建议以 .html 结尾）" spellcheck="false">
</header>

<main id="main">
  <section id="code-pane">
    <div id="code-head">
      <span>源代码</span>
      <span id="code-size"></span>
    </div>
    <div id="code-body">
      <div id="gutter"><div id="gutter-inner">1</div></div>
      <div id="code-area">
        <pre id="hl-wrap" aria-hidden="true"><code id="hl"></code></pre>
        <textarea id="code" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
    </div>
  </section>

  <div id="divider" title="拖动调整分栏"></div>

  <section id="preview-pane">
    <iframe id="preview" sandbox="allow-same-origin" title="预览"></iframe>

    <div id="preview-hint" hidden>
      <div>
        <div id="preview-hint-title"></div>
        <div id="preview-hint-sub"></div>
      </div>
    </div>

    <div id="props-panel" hidden>
      <div class="pp-head">
        <span id="pp-breadcrumb"></span>
        <button id="pp-close" title="关闭面板 (Esc)">×</button>
      </div>
      <div class="pp-body">
        <div class="pp-sec">
          <div class="pp-title">通用</div>
          <div class="pp-row pp-btns">
            <button class="pp-btn" data-act="delete" title="删除选中元素">删除</button>
            <button class="pp-btn" data-act="clone" title="复制选中元素并插入到其后">复制</button>
            <button class="pp-btn" data-act="up" title="与上一个兄弟元素交换位置">上移</button>
            <button class="pp-btn" data-act="down" title="与下一个兄弟元素交换位置">下移</button>
            <button class="pp-btn" data-act="visibility" title="隐藏 / 显示选中元素">隐藏</button>
            <button class="pp-btn" data-act="clearstyles" title="移除元素的全部内联 style">清除样式</button>
          </div>
        </div>

        <div class="pp-sec" id="pp-sec-text">
          <div class="pp-title">文本内容</div>
          <textarea id="pp-text" rows="3" spellcheck="false" placeholder="替换元素的直接文字，换行会变成换行符，子元素不受影响"></textarea>
          <div class="pp-row"><button class="pp-btn" data-act="applyText">应用文本</button></div>
        </div>

        <div class="pp-sec">
          <div class="pp-title">字体与颜色</div>
          <div class="pp-row">
            <label>字号</label>
            <input type="range" id="pp-fs-range" min="8" max="72" step="1">
            <input type="number" id="pp-fs-num" min="1" max="400" step="1">
            <span>px</span>
          </div>
          <div class="pp-row">
            <label>字重</label>
            <select id="pp-weight">
              <option value="">不变</option>
              <option value="100">100</option><option value="200">200</option>
              <option value="300">300</option><option value="400">400</option>
              <option value="500">500</option><option value="600">600</option>
              <option value="700">700</option><option value="800">800</option>
              <option value="900">900</option>
            </select>
            <label>对齐</label>
            <select id="pp-align">
              <option value="">不变</option>
              <option value="left">左对齐</option>
              <option value="center">居中</option>
              <option value="right">右对齐</option>
              <option value="justify">两端对齐</option>
            </select>
          </div>
          <div class="pp-row">
            <label>文字色</label>
            <input type="color" id="pp-color">
            <button class="pp-mini" data-act="clearColor">清除</button>
          </div>
          <div class="pp-row">
            <label>背景色</label>
            <input type="color" id="pp-bgcolor">
            <button class="pp-mini" data-act="clearBg">清除</button>
          </div>
        </div>

        <div class="pp-sec">
          <div class="pp-title">透明度 <span id="pp-opacity-val">100%</span></div>
          <input type="range" id="pp-opacity" min="0" max="100" step="1">
        </div>

        <details class="pp-sec" id="pp-sec-border">
          <summary>边框</summary>
          <div class="pp-row">
            <label>宽度</label>
            <input type="number" id="pp-bw" min="0" max="50" step="1">
            <span>px</span>
            <select id="pp-bs">
              <option value="solid">实线</option>
              <option value="dashed">虚线</option>
              <option value="dotted">点线</option>
              <option value="double">双线</option>
            </select>
            <input type="color" id="pp-bc">
          </div>
          <div class="pp-row">
            <button class="pp-btn" data-act="applyBorder">应用边框</button>
            <button class="pp-btn" data-act="clearBorder">清除</button>
          </div>
        </details>

        <div class="pp-sec" id="pp-sec-img">
          <div class="pp-title">图片</div>
          <div class="pp-row"><input type="text" id="pp-img-src" placeholder="图片 URL 或 data URI" spellcheck="false"></div>
          <div class="pp-row">
            <button class="pp-btn" data-act="applyImgSrc">应用地址</button>
            <button class="pp-btn" data-act="uploadImg">上传本地图片</button>
            <input type="file" id="pp-img-file" accept="image/*" hidden>
          </div>
          <div class="pp-row"><label>描述 alt</label><input type="text" id="pp-img-alt" spellcheck="false"></div>
        </div>

        <div class="pp-sec" id="pp-sec-link">
          <div class="pp-title">链接</div>
          <div class="pp-row"><input type="text" id="pp-link-href" placeholder="https://..." spellcheck="false"></div>
          <div class="pp-row">
            <label>打开方式</label>
            <select id="pp-link-target">
              <option value="">当前窗口</option>
              <option value="_blank">新窗口</option>
            </select>
            <button class="pp-btn" data-act="applyLink">应用链接</button>
          </div>
        </div>

        <div class="pp-tip">双击预览中的元素可直接修改文字</div>
      </div>
    </div>
  </section>
</main>

<footer id="statusbar">
  <span id="status-msg"></span>
  <span id="status-warn"></span>
  <span class="sb-flex"></span>
  <span id="status-sel"></span>
  <span id="status-pos">行 1, 列 1</span>
  <span id="status-size"></span>
</footer>

<div id="drop-hint"><div>松开以打开 HTML 文件</div></div>

<script src="js/sample.js"></script>
<script src="js/history.js"></script>
<script src="js/io.js"></script>
<script src="js/codeEditor.js"></script>
<script src="js/preview.js"></script>
<script src="js/props.js"></script>
<script src="js/app.js"></script>
</body>
</html>
