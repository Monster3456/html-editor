<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 可视化编辑器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="toolbar">
  <div id="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    <span>HTML 编辑器</span>
  </div>

  <div class="menu-wrap" id="open-menu">
    <button class="btn" id="btn-open" title="打开文件或项目文件夹">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span>打开</span>
      <svg class="ic-caret" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="menu" id="open-menu-list" hidden>
      <button class="menu-item" id="mi-open-file">
        <svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        <span>打开文件…</span><kbd>Ctrl+O</kbd>
      </button>
      <button class="menu-item" id="mi-open-dir">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span>打开项目文件夹…</span>
      </button>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-export" title="导出编辑后的 HTML (Ctrl+S)">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span>导出 HTML</span>
  </button>

  <span class="tb-sep"></span>

  <div class="menu-wrap" id="insert-menu">
    <button class="btn" id="btn-insert" title="插入新元素到选中元素之后">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>插入</span>
      <svg class="ic-caret" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="menu" id="insert-menu-list" hidden>
      <button class="menu-item" data-insert="h2"><span class="mi-tag">H2</span><span>标题</span></button>
      <button class="menu-item" data-insert="h3"><span class="mi-tag">H3</span><span>副标题</span></button>
      <button class="menu-item" data-insert="p"><span class="mi-tag">P</span><span>段落</span></button>
      <button class="menu-item" data-insert="img"><span class="mi-tag">IMG</span><span>图片</span></button>
      <button class="menu-item" data-insert="button"><span class="mi-tag">BTN</span><span>按钮</span></button>
      <button class="menu-item" data-insert="a"><span class="mi-tag">A</span><span>链接</span></button>
      <button class="menu-item" data-insert="hr"><span class="mi-tag">HR</span><span>分隔线</span></button>
      <button class="menu-item" data-insert="div"><span class="mi-tag">DIV</span><span>容器</span></button>
      <button class="menu-item" data-insert="ul"><span class="mi-tag">UL</span><span>列表</span></button>
      <button class="menu-item" data-insert="blockquote"><span class="mi-tag">QTE</span><span>引用块</span></button>
      <button class="menu-item" data-insert="video"><span class="mi-tag">VID</span><span>视频嵌入</span></button>
    </div>
  </div>

  <span class="tb-sep"></span>

  <div class="seg" id="device-seg" title="预览设备宽度">
    <button class="seg-btn" data-w="375" title="手机 375px">
      <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
    </button>
    <button class="seg-btn" data-w="768" title="平板 768px">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
    </button>
    <button class="seg-btn active" data-w="0" title="桌面 自适应">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
    </button>
  </div>

  <button class="btn icon-only" id="btn-undo" title="撤销 (Ctrl+Z)" disabled>
    <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
  </button>
  <button class="btn icon-only" id="btn-redo" title="重做 (Ctrl+Y)" disabled>
    <svg viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
  </button>
  <button class="btn icon-only" id="btn-refresh" title="按当前源码重新渲染预览">
    <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
  </button>
  <button class="btn icon-only" id="btn-reset" title="恢复为打开时的原始内容">
    <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
  </button>
  <button class="btn icon-only" id="btn-newwin" title="在浏览器新窗口中打开当前预览">
    <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
  </button>

  <span class="tb-flex"></span>

  <label class="switch" title="默认禁用页面脚本以保证编辑稳定；开启后脚本会执行并可能干扰编辑">
    <input type="checkbox" id="chk-scripts">
    <span class="sw-track"><span class="sw-knob"></span></span>
    <span class="sw-label">允许脚本</span>
  </label>

  <span id="dirty-dot" title="有未导出的修改" hidden>●</span>
  <input type="text" id="filename" value="未命名.html" title="导出文件名（可修改）" spellcheck="false">
</header>

<input type="file" id="file-input" accept=".html,.htm,.xhtml,text/html" multiple hidden>
<input type="file" id="dir-input" webkitdirectory multiple hidden>

<main id="main">
  <aside id="tree-pane">
    <div id="tree-head">
      <span class="ch-label"><span class="ch-dot"></span>元素</span>
      <button id="tree-toggle" title="折叠元素面板">
        <svg viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </button>
    </div>
    <div id="tree-body"><div id="tree-root"></div></div>
  </aside>

  <button id="tree-collapsed-btn" title="展开元素面板" hidden>
    <svg viewBox="0 0 24 24"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
  </button>

  <section id="code-pane">
    <div id="code-head">
      <span class="ch-label"><span class="ch-dot"></span>源代码</span>
      <span id="code-size"></span>
    </div>
    <div id="find-bar" hidden>
      <input type="text" id="find-input" placeholder="查找…" spellcheck="false">
      <span id="find-count"></span>
      <button class="fb-btn" id="find-prev" title="上一个 (Enter)">↑</button>
      <button class="fb-btn" id="find-next" title="下一个 (Shift+Enter)">↓</button>
      <input type="text" id="replace-input" placeholder="替换为…" spellcheck="false">
      <button class="fb-btn" id="find-replace" title="替换当前">替换</button>
      <button class="fb-btn" id="find-replace-all" title="全部替换">全部</button>
      <button class="fb-btn" id="find-close" title="关闭 (Esc)">×</button>
    </div>
    <div id="code-body">
      <div id="gutter"><div id="gutter-inner">1</div></div>
      <div id="code-area">
        <pre id="hl-wrap" aria-hidden="true"><code id="hl"></code></pre>
        <textarea id="code" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="在此输入或粘贴 HTML 代码…"></textarea>
      </div>
    </div>
  </section>

  <div id="divider" title="拖动调整分栏"></div>

  <section id="preview-pane">
    <div id="device-label" hidden></div>
    <iframe id="preview" sandbox="allow-same-origin" title="预览"></iframe>

    <div id="ctx-menu" hidden></div>

    <div id="coach" hidden>
      <svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
      <span>单击选中元素 · 双击编辑文字</span>
      <button id="coach-x" title="知道了">×</button>
    </div>

    <div id="preview-hint" hidden>
      <div>
        <div id="preview-hint-title"></div>
        <div id="preview-hint-sub"></div>
      </div>
    </div>

    <div id="props-panel" hidden>
      <div class="pp-head">
        <span id="pp-breadcrumb"></span>
        <button id="pp-close" title="关闭面板 (Esc)">×</button>
      </div>
      <div class="pp-body">
        <div class="pp-sec">
          <div class="pp-title">通用操作</div>
          <div class="pp-row pp-btns">
            <button class="pp-btn" data-act="delete" title="删除选中元素">删除</button>
            <button class="pp-btn" data-act="clone" title="复制选中元素并插入到其后">复制</button>
            <button class="pp-btn" data-act="up" title="与上一个兄弟元素交换位置">上移</button>
            <button class="pp-btn" data-act="down" title="与下一个兄弟元素交换位置">下移</button>
            <button class="pp-btn" data-act="visibility" title="隐藏 / 显示选中元素">隐藏</button>
            <button class="pp-btn" data-act="clearstyles" title="移除元素的全部内联 style">清除样式</button>
          </div>
        </div>

        <div class="pp-sec" id="pp-sec-text">
          <div class="pp-title">文本内容</div>
          <textarea id="pp-text" rows="3" spellcheck="false" placeholder="替换元素的直接文字，换行会变成换行符，子元素不受影响"></textarea>
          <div class="pp-row"><button class="pp-btn" data-act="applyText">应用文本</button></div>
        </div>

        <div class="pp-sec" id="pp-sec-size">
          <div class="pp-title">尺寸与间距</div>
          <div class="pp-row"><span class="pp-actual" id="pp-actual">实际尺寸 — × —</span></div>
          <div class="pp-row">
            <label>宽</label>
            <input type="number" id="pp-w" min="0" step="1" placeholder="自动">
            <span class="pp-unit">px</span>
            <label>高</label>
            <input type="number" id="pp-h" min="0" step="1" placeholder="自动">
            <span class="pp-unit">px</span>
          </div>
          <div class="pp-row">
            <button class="pp-mini" data-act="clearSize">清除宽高</button>
          </div>
          <div class="pp-row">
            <label>内边距</label>
            <input type="number" id="pp-pad" min="0" step="1">
            <span class="pp-unit">px</span>
            <label>外边距</label>
            <input type="number" id="pp-mar" min="0" step="1">
            <span class="pp-unit">px</span>
          </div>
          <div class="pp-row">
            <label>圆角</label>
            <input type="number" id="pp-radius" min="0" step="1">
            <span class="pp-unit">px</span>
            <button class="pp-mini" data-act="clearSpacing">清除</button>
          </div>
        </div>

        <div class="pp-sec">
          <div class="pp-title">字体与颜色</div>
          <div class="pp-row">
            <label>字号</label>
            <input type="range" id="pp-fs-range" min="8" max="72" step="1">
            <input type="number" id="pp-fs-num" min="1" max="400" step="1">
            <span class="pp-unit">px</span>
          </div>
          <div class="pp-row">
            <label>字重</label>
            <select id="pp-weight">
              <option value="">不变</option>
              <option value="100">100</option><option value="200">200</option>
              <option value="300">300</option><option value="400">400</option>
              <option value="500">500</option><option value="600">600</option>
              <option value="700">700</option><option value="800">800</option>
              <option value="900">900</option>
            </select>
            <label>对齐</label>
            <select id="pp-align">
              <option value="">不变</option>
              <option value="left">左对齐</option>
              <option value="center">居中</option>
              <option value="right">右对齐</option>
              <option value="justify">两端对齐</option>
            </select>
          </div>
          <div class="pp-row">
            <label>文字色</label>
            <input type="color" id="pp-color">
            <button class="pp-mini" data-act="clearColor">清除</button>
            <label>背景色</label>
            <input type="color" id="pp-bgcolor">
            <button class="pp-mini" data-act="clearBg">清除</button>
          </div>
        </div>

        <div class="pp-sec">
          <div class="pp-title">透明度 <span id="pp-opacity-val">100%</span></div>
          <input type="range" id="pp-opacity" min="0" max="100" step="1">
        </div>

        <details class="pp-sec" id="pp-sec-border">
          <summary>边框</summary>
          <div class="pp-row">
            <label>宽度</label>
            <input type="number" id="pp-bw" min="0" max="50" step="1">
            <span class="pp-unit">px</span>
            <select id="pp-bs">
              <option value="solid">实线</option>
              <option value="dashed">虚线</option>
              <option value="dotted">点线</option>
              <option value="double">双线</option>
            </select>
            <input type="color" id="pp-bc">
          </div>
          <div class="pp-row">
            <button class="pp-btn" data-act="applyBorder">应用边框</button>
            <button class="pp-btn" data-act="clearBorder">清除</button>
          </div>
        </details>

        <div class="pp-sec" id="pp-sec-img">
          <div class="pp-title">图片</div>
          <div class="pp-row"><input type="text" id="pp-img-src" placeholder="图片 URL 或 data URI" spellcheck="false"></div>
          <div class="pp-row">
            <button class="pp-btn" data-act="applyImgSrc">应用地址</button>
            <button class="pp-btn" data-act="uploadImg">上传本地图片</button>
            <input type="file" id="pp-img-file" accept="image/*" hidden>
          </div>
          <div class="pp-row"><label>描述 alt</label><input type="text" id="pp-img-alt" spellcheck="false"></div>
        </div>

        <div class="pp-sec" id="pp-sec-link">
          <div class="pp-title">链接</div>
          <div class="pp-row"><input type="text" id="pp-link-href" placeholder="https://..." spellcheck="false"></div>
          <div class="pp-row">
            <label>打开方式</label>
            <select id="pp-link-target">
              <option value="">当前窗口</option>
              <option value="_blank">新窗口</option>
            </select>
            <button class="pp-btn" data-act="applyLink">应用</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="statusbar">
  <span id="status-msg"></span>
  <span id="status-warn"></span>
  <span id="status-draft"></span>
  <span class="sb-flex"></span>
  <span id="status-proj"></span>
  <span id="status-sel"></span>
  <span id="status-pos">行 1, 列 1</span>
  <span id="status-size"></span>
</footer>

<div id="drop-hint"><div>松开以打开 HTML 文件</div></div>

<div id="picker" class="overlay" hidden>
  <div class="modal">
    <h2>选择要编辑的 HTML 文件</h2>
    <p class="modal-sub" id="picker-sub"></p>
    <div id="picker-list"></div>
    <div class="modal-actions">
      <button class="btn" id="picker-cancel">取消</button>
      <button class="btn btn-primary" id="picker-ok">打开</button>
    </div>
  </div>
</div>

<div id="welcome" class="overlay">
  <div class="welcome-card">
    <div class="welcome-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </div>
    <h1>HTML 可视化编辑器</h1>
    <p class="welcome-sub">打开文件，在预览中点击元素即可编辑，完成后一键导出</p>
    <div class="welcome-actions">
      <button class="wcard wcard-resume" id="wc-resume" hidden>
        <span class="wcard-ic">
          <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </span>
        <span class="wcard-tx"><span class="wcard-t">恢复上次编辑</span><span class="wcard-d" id="wc-resume-info"></span></span>
      </button>
      <button class="wcard" id="wc-open-file">
        <span class="wcard-ic">
          <svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        </span>
        <span class="wcard-tx"><span class="wcard-t">打开 HTML 文件</span><span class="wcard-d">编辑单个网页文件</span></span>
      </button>
      <button class="wcard" id="wc-open-dir">
        <span class="wcard-ic">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </span>
        <span class="wcard-tx"><span class="wcard-t">打开项目文件夹</span><span class="wcard-d">支持 HTML + CSS + 图片，可选要编辑的页面</span></span>
      </button>
      <button class="wcard" id="wc-sample">
        <span class="wcard-ic">
          <svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
        </span>
        <span class="wcard-tx"><span class="wcard-t">使用示例页面</span><span class="wcard-d">快速体验各项编辑功能</span></span>
      </button>
    </div>
    <p class="welcome-hint">也可以直接把 .html 文件或项目文件拖到窗口任意位置</p>
  </div>
</div>

<script src="js/sample.js"></script>
<script src="js/history.js"></script>
<script src="js/io.js"></script>
<script src="js/project.js"></script>
<script src="js/draft.js"></script>
<script src="js/codeEditor.js"></script>
<script src="js/preview.js"></script>
<script src="js/props.js"></script>
<script src="js/tree.js"></script>
<script src="js/insert.js"></script>
<script src="js/contextmenu.js"></script>
<script src="js/app.js"></script>
</body>
</html>
